<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="악보 플레이어">
<meta name="theme-color" content="#121418">
<title>주니퍼 악보 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121418; --panel:#1b1e24; --panel2:#252931; --line:#2f343d;
  --text:#eef0f3; --muted:#9aa1ad; --accent:#ffb020; --green:#3ddc97;
  --blue:#0a84ff; --danger:#ff5a5f; --cursor:#ff3b30;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 14px) 10px calc(var(--safe-l) + 14px);
  background:var(--bg);border-bottom:1px solid var(--line);min-height:56px;flex:none}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),#1b8f63);
  display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;margin:0;font-weight:900;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--panel2)}
.iconbtn svg{width:22px;height:22px}

/* ---------- library ---------- */
.libtools{display:flex;gap:8px;padding:12px calc(var(--safe-r) + 14px) 4px calc(var(--safe-l) + 14px);flex:none}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;height:42px}
.search input{flex:1;background:none;border:0;outline:none;font-size:15px;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.sortsel{background:var(--panel);border:1px solid var(--line);border-radius:12px;height:42px;padding:0 10px;font-size:14px;outline:none}
#libList{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:12px calc(var(--safe-r) + 14px) calc(var(--safe-b) + 100px) calc(var(--safe-l) + 14px);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;
  text-align:left;display:flex;flex-direction:column;transition:transform .12s}
.card:active{transform:scale(.97)}
.card .thumb{aspect-ratio:4/3;background:#fff center top/cover no-repeat;border-bottom:1px solid var(--line)}
.card .meta{padding:10px 12px 12px}
.card .t{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.chip.bpm{background:rgba(255,176,32,.15);color:var(--accent)}
.chip.warn{background:rgba(255,90,95,.15);color:var(--danger)}
.chip.busy{background:rgba(10,132,255,.15);color:#6cb4ff}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 20px;line-height:1.7}
.empty .big{font-size:52px;margin-bottom:6px}
.empty b{color:var(--text)}
.fab{position:fixed;right:calc(var(--safe-r) + 18px);bottom:calc(var(--safe-b) + 20px);height:56px;padding:0 22px;border-radius:28px;
  background:var(--green);color:#06281a;font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(61,220,151,.35)}
.fab svg{width:22px;height:22px}

/* ---------- player ---------- */
#player .topbar .ttl{flex:1;min-width:0;text-align:left}
#player .topbar .ttl b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .topbar .ttl span{font-size:12px;color:var(--muted)}
#scoreScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#2b2e35;position:relative}
#pages{position:relative;margin:0 auto;padding:12px 0 40px;display:flex;flex-direction:column;gap:12px;width:min(100%,1100px)}
#pages.z{margin:0}
.page{position:relative;background:#fff;width:100%;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.page img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
.overlay{position:absolute;inset:0;-webkit-user-select:none;user-select:none}
.mbox{position:absolute;border-radius:3px;pointer-events:none;transition:background .1s}
.mbox.cur{background:rgba(255,176,32,.20)}
.mbox.start{box-shadow:inset 0 0 0 2px var(--green);background:rgba(61,220,151,.10)}
.mbox.start.cur{background:rgba(255,176,32,.20)}
.cursor{position:absolute;width:3px;margin-left:-1.5px;background:var(--cursor);border-radius:2px;pointer-events:none;display:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.6),0 0 10px rgba(255,59,48,.75);z-index:5}
/* edit mode */
.sysband{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(10,132,255,.55);border-bottom:1.5px dashed rgba(10,132,255,.55);
  background:rgba(10,132,255,.05);pointer-events:none}
.sysband.sel{background:rgba(10,132,255,.13)}
.bline{position:absolute;width:2px;margin-left:-1px;background:var(--blue);pointer-events:none;z-index:3}
.bhandle{position:absolute;width:34px;margin-left:-17px;touch-action:none;z-index:4;cursor:ew-resize}
.bhandle::after{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.sysdel{position:absolute;right:4px;z-index:6;background:var(--danger);color:#fff;font-size:12px;font-weight:700;
  padding:5px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.editbar{display:none;flex:none;align-items:center;gap:8px;padding:8px calc(var(--safe-r) + 12px) 8px calc(var(--safe-l) + 12px);
  background:#0d2747;border-bottom:1px solid #1d4f8a;font-size:12.5px;color:#cfe3ff;line-height:1.4}
.editbar.on{display:flex}
.editbar .msg{flex:1}
.pill{height:34px;padding:0 14px;border-radius:10px;font-weight:700;font-size:13.5px;background:var(--panel2);white-space:nowrap}
.pill.primary{background:var(--blue);color:#fff}
.pill.green{background:var(--green);color:#06281a}
.pill.danger{background:rgba(255,90,95,.15);color:var(--danger)}

.bottombar{flex:none;background:var(--panel);border-top:1px solid var(--line);
  padding:8px calc(var(--safe-r) + 12px) calc(var(--safe-b) + 10px) calc(var(--safe-l) + 12px)}
.status{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding:0 4px 8px;gap:8px}
.status b{color:var(--text)}
.status .pos{font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ctl{width:46px;height:46px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;flex:none}
.ctl svg{width:22px;height:22px}
.ctl.off{opacity:.45}
.ctl.on{background:rgba(10,132,255,.25);color:#7fbcff}
.play{width:62px;height:62px;border-radius:50%;background:var(--accent);color:#2a1a00;display:grid;place-items:center;flex:none;
  box-shadow:0 6px 18px rgba(255,176,32,.35)}
.play svg{width:28px;height:28px}
.play.playing{background:var(--text);color:var(--bg);box-shadow:none}
.bpmbox{display:flex;align-items:center;background:var(--panel2);border-radius:14px;height:46px;overflow:hidden;flex:none}
.bpmbox button{width:40px;height:46px;font-size:22px;font-weight:700;display:grid;place-items:center;touch-action:manipulation}
.bpmbox button:active{background:var(--line)}
.bpmval{min-width:64px;text-align:center;line-height:1.05}
.bpmval b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.bpmval span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.grp{display:flex;gap:8px;align-items:center}

/* count-in */
#countin{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:50;background:rgba(10,12,16,.35)}
#countin.on{display:grid}
#countin .n{font-size:min(46vmin,340px);font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 10px 40px rgba(0,0,0,.6);animation:pop .35s ease-out}
#countin .lbl{position:absolute;top:calc(50% + min(26vmin,190px));left:0;right:0;text-align:center;color:#fff;font-weight:700;
  letter-spacing:4px;font-size:15px;opacity:.85}
@keyframes pop{from{transform:scale(1.35);opacity:.2}to{transform:scale(1);opacity:1}}

/* ---------- modal / toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:100}
.backdrop.on{display:flex}
@media (min-width:640px){.backdrop{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:480px;border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;
  padding:18px 18px calc(var(--safe-b) + 18px)}
@media (min-width:640px){.sheet{border-radius:20px}}
.sheet h2{margin:0 0 14px;font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.field input[type=text],.field input[type=number]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);padding:0 14px;font-size:16px;outline:none}
.field input:focus{border-color:var(--green)}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.toggle span{font-size:15px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}
.sw.on::after{left:23px}
input[type=range]{width:100%;accent-color:var(--green)}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:48px;border-radius:14px;font-weight:700;font-size:15px;background:var(--panel2)}
.btn.primary{background:var(--green);color:#06281a}
.btn.danger{background:rgba(255,90,95,.15);color:var(--danger)}
.btnlist{display:flex;flex-direction:column;gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:14px}
.btnlist .btn{flex:none;text-align:left;padding:0 16px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 150px);transform:translateX(-50%);background:#000c;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;display:none;max-width:90vw;text-align:center}
#toast.on{display:block}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none;place-items:center}
#busy.on{display:grid}
#busy .box{background:var(--panel);padding:22px 26px;border-radius:18px;text-align:center;min-width:240px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);margin:0 auto 12px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#busy .msg{font-size:14px;line-height:1.5}
.hidden{display:none!important}
.editseg{flex:none;background:#0a1d36;border-color:#1d4f8a}
.editseg button{height:30px;padding:0 10px;font-size:12.5px;color:#9cc4f5;white-space:nowrap}
@media (max-width:640px){.editbar{flex-wrap:wrap}.editbar .msg{order:5;flex-basis:100%;font-size:12px}.editbar .editseg{flex:1}}
.editseg button.on{background:var(--blue);color:#fff}
.orderline{display:none;flex:none;padding:7px calc(var(--safe-r) + 12px) 7px calc(var(--safe-l) + 12px);background:#0a1a2e;border-bottom:1px solid #1d4f8a;
  font-size:12.5px;color:#cfe3ff;line-height:1.45;white-space:nowrap;overflow-x:auto}
.orderline b{color:#fff;margin-right:4px}
.orderline span{color:#8fb3e0}
body.editing .orderline{display:block}
.mbox.tappable{pointer-events:auto;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(10,132,255,.35)}
.mbox.tappable:hover{background:rgba(10,132,255,.08)}
.mkbadge{position:absolute;left:0;right:0;top:-2px;transform:translateY(-100%);display:flex;flex-wrap:wrap;gap:2px;pointer-events:none;z-index:4}
.mkbadge span{background:#7a3cff;color:#fff;font-size:clamp(9px,1.25vw,12px);font-weight:800;padding:1px 5px;border-radius:5px;line-height:1.35;white-space:nowrap}
.mkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mkgrid button{height:48px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.mkgrid button.on{background:rgba(122,60,255,.22);border-color:#7a3cff;color:#fff}
.mksec{font-size:12.5px;color:var(--muted);font-weight:700;margin:14px 0 6px}
/* ---------- 재생 중 전체화면(몰입) 모드 ---------- */
body.immersive #player > .topbar, body.immersive #editBar, body.immersive .notice{display:none!important}
body.immersive #scoreScroll{background:#fff}
body.immersive #pages{padding:calc(var(--safe-t) + 4px) 0 120px;gap:0;width:100%}
body.immersive #pages.z{width:auto}
body.immersive .page{box-shadow:none;border-bottom:1px solid #e6e6e6}
body.immersive #player .bottombar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);
  border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(20,22,27,.84);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:20}
body.immersive .status{padding:0 4px 6px;justify-content:center;font-size:12px}
body.immersive .status #infoTxt{display:none}
body.immersive #rewBtn, body.immersive #metBtn, body.immersive #editBtn{display:none}
body.immersive .controls{gap:12px;justify-content:center}
body.immersive .play{width:52px;height:52px}
body.immersive .play svg{width:24px;height:24px}
.notice{display:none;flex:none;align-items:center;gap:10px;padding:10px calc(var(--safe-r) + 12px) 10px calc(var(--safe-l) + 12px);
  background:#3a2a06;border-bottom:1px solid #6b4d0b;color:#ffe2a6;font-size:13px;line-height:1.45}
.notice.on{display:flex}
.notice .msg{flex:1}
.tapbtn{width:100%;height:96px;border-radius:18px;background:var(--panel2);border:2px dashed var(--line);font-size:18px;font-weight:900;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;margin-top:4px}
.tapbtn:active,.tapbtn.hit{background:rgba(255,176,32,.18);border-color:var(--accent);color:var(--accent)}
.bigbpm{display:flex;align-items:center;gap:10px}
.bigbpm button{width:56px;height:56px;border-radius:14px;background:var(--panel2);font-size:26px;font-weight:700;flex:none}
.bigbpm input{flex:1;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:28px;font-weight:900;outline:none;min-width:0}
</style>
</head>
<body>

<!-- ================= LIBRARY ================= -->
<section id="library" class="view on">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#06281a" stroke-width="2.4" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="#06281a"/><circle cx="16.5" cy="16" r="2.5" fill="#06281a"/></svg></div>
      <div style="min-width:0"><h1>주니퍼 악보 플레이어</h1><small>합주 · 연습용 악보 진행 표시</small></div>
    </div>
  </header>
  <div class="libtools">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="노래 제목 검색" autocomplete="off">
    </div>
    <select id="sort" class="sortsel">
      <option value="recent">최근 연습</option>
      <option value="added">추가한 순</option>
      <option value="title">제목순</option>
    </select>
  </div>
  <div id="libList"></div>
  <button class="fab" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>악보 추가</button>
  <input type="file" id="fileIn" accept="application/pdf,.pdf,image/*" multiple hidden>
</section>

<!-- ================= PLAYER ================= -->
<section id="player" class="view">
  <header class="topbar">
    <button class="iconbtn" id="backBtn" aria-label="목록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="ttl" id="ttlBtn"><b id="pTitle">제목</b><span id="pSub"></span></button>
    <button class="iconbtn" id="zoomBtn" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button>
    <button class="iconbtn" id="setBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="editbar" id="editBar">
    <div class="seg editseg" id="editSeg"><button data-sub="bars" class="on">마디선</button><button data-sub="marks">반복·코다</button></div>
    <div class="msg" id="editMsg"></div>
    <button class="pill" id="redetectBtn">자동 인식</button>
    <button class="pill primary" id="editDone">완료</button>
  </div>
  <div class="orderline" id="orderLine"></div>

<script>
'use strict';
/* =====================================================================
   주니퍼 악보 플레이어
   - 악보(PDF/이미지) → 제목·BPM·마디 자동 인식 → 기기 내(IndexedDB) 저장
   - 카운트인 + 메트로놈 + 마디 진행선
   ===================================================================== */
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const MAX_PDF_PAGES = 30;
const RENDER_W = 1800;

const $ = (s, el = document) => el.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const median = arr => { if (!arr.length) return 0; const a = [...arr].sort((x, y) => x - y); const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };

const prefs = (() => {
  let p = { metroOn: true, vol: 0.8, sort: 'recent' };
  try { Object.assign(p, JSON.parse(localStorage.getItem('jsp-prefs') || '{}')); } catch (e) {}
  return new Proxy(p, { set(t, k, v) { t[k] = v; try { localStorage.setItem('jsp-prefs', JSON.stringify(t)); } catch (e) {} return true; } });
})();

/* ============================ Storage (IndexedDB) ============================ */
const DB = {
  db: null, mem: null,
  async open() {
    if (this.db || this.mem) return;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('juniper-score-player', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('scores', { keyPath: 'id' }); d.createObjectStore('pages'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    } catch (e) {
      console.warn('IndexedDB 사용 불가', e);
      this.mem = { scores: new Map(), pages: new Map() };
      setTimeout(() => toast('이 브라우저에서는 저장이 되지 않아요 (창을 닫으면 사라짐)'), 600);
    }
  },
  async req(store, mode, fn) {
    await this.open();
    if (this.mem) return fn(null, this.mem[store]);
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      let out; const r = fn(s);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  allScores() { return this.req('scores', 'readonly', (s, m) => m ? [...m.values()] : s.getAll()); },
  getScore(id) { return this.req('scores', 'readonly', (s, m) => m ? m.get(id) : s.get(id)); },
  putScore(sc) { return this.req('scores', 'readwrite', (s, m) => m ? m.set(sc.id, sc) : s.put(sc)); },
  // iOS/iPadOS(WebKit)는 IndexedDB에 넣은 Blob을 다시 못 읽는 경우가 있어 바이트(ArrayBuffer)로 저장
  async putPage(id, i, blob) {
    const rec = { type: blob.type || 'image/jpeg', buf: await blob.arrayBuffer() };
    return this.req('pages', 'readwrite', (s, m) => m ? m.set(id + ':' + i, rec) : s.put(rec, id + ':' + i));
  },
  async getPage(id, i) {
    const v = await this.req('pages', 'readonly', (s, m) => m ? m.get(id + ':' + i) : s.get(id + ':' + i));
    if (!v) return null;
    if (v.buf) return new Blob([v.buf], { type: v.type || 'image/jpeg' });
    if (v instanceof Blob) { // 예전 방식으로 저장된 페이지 → 읽히면 새 방식으로 옮겨 저장
      try { const buf = await v.arrayBuffer(); const b = new Blob([buf], { type: v.type || 'image/jpeg' }); this.putPage(id, i, b).catch(() => {}); return b; }
      catch (e) { console.warn('저장된 이미지를 읽을 수 없음', e); return null; }
    }
    return null;
  },
  async deleteScore(sc) {
    await this.req('scores', 'readwrite', (s, m) => m ? m.delete(sc.id) : s.delete(sc.id));
    await this.req('pages', 'readwrite', (s, m) => { for (let i = 0; i < sc.pages.length; i++) m ? m.delete(sc.id + ':' + i) : s.delete(sc.id + ':' + i); });
  }
};

function askBpm(value, title = 'BPM 정하기', hint = '') {

      <div class="bigbpm"><button data-d="-1">−</button><input type="number" inputmode="numeric" id="bpmIn" min="30" max="300" value="${value}"><button data-d="1">+</button></div>
      <button class="tapbtn" id="tapBtn">👆 여기를 박자에 맞춰 탭<br><span style="font-size:12px;font-weight:500;color:var(--muted)" id="tapInfo">노래를 틀어놓고 4번 이상 두드리면 BPM이 계산돼요</span></button>

    const inp = $('#bpmIn', s), info = $('#tapInfo', s), tap = $('#tapBtn', s);
    s.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { inp.value = clamp((Math.round(+inp.value) || 100) + +b.dataset.d, 30, 300); });
    let taps = [];
    tap.addEventListener('pointerdown', e => {

      tap.classList.add('hit'); setTimeout(() => tap.classList.remove('hit'), 90);
      if (taps.length >= 2) {
        const iv = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);

        inp.value = bpm;
        info.textContent = taps.length < 4 ? `${bpm} BPM… 조금 더 탭해 주세요` : `${bpm} BPM (${taps.length}번 탭 평균)`;
      } else info.textContent = '계속 탭하세요…';
    });
    const ok = () => { const v = Math.round(+inp.value); if (v >= 30 && v <= 300) closeSheet(v); else toast('30~300 사이로 입력해 주세요'); };
    s.querySelector('[data-v="0"]').onclick = () => closeSheet(null);

    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  });
}
async function promptBpm(first) {
  const sc = state.score; if (!sc) return;
  if (Engine.playing) Engine.stop();
  const v = await askBpm(sc.bpm, first ? '이 곡의 BPM을 정해주세요' : 'BPM 정하기',
    first ? '악보에서 BPM을 찾지 못했어요. 숫자를 입력하거나, 노래에 맞춰 아래를 탭하세요.' : '');
  if (v) setBpm(v);
  updateNotices();
}
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src));
    document.head.appendChild(s);

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

/* ============================ 마디(오선/마디선) 자동 인식 ============================ */
function otsu(hist, total) {
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue; const wF = total - wB; if (!wF) break;
    sumB += i * hist[i]; const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF); if (v > best) { best = v; thr = i; }
  }
  return thr;
}

/** canvas → [{page, y0, y1, xs:[...]}] (좌표는 0~1 정규화) */
function detectSystems(canvas, page) {
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const d = ctx.getImageData(0, 0, W, H).data;
  const N = W * H, gray = new Uint8Array(N), hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    const v = d[j + 3] < 128 ? 255 : ((d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000) | 0;
    gray[i] = v; hist[v]++;
  }
  const thr = clamp(otsu(hist, N), 90, 200);
  const bin = new Uint8Array(N);
  for (let i = 0; i < N; i++) bin[i] = gray[i] < thr ? 1 : 0;

  // 1) 가로 투영 → 오선 후보
  // (긴 가로 런만 셈 → 오선에 붙은 음표 머리·글자는 무시)
  const rows = new Uint32Array(H), minRun = Math.max(20, Math.round(W / 25));
  for (let y = 0; y < H; y++) {
    let c = 0, run = 0; const o = y * W;
    for (let x = 0; x <= W; x++) {
      if (x < W && bin[o + x]) run++;
      else { if (run >= minRun) c += run; run = 0; }
    }
    rows[y] = c;
  }
  const lines = [];
  for (let y = 0; y < H; y++) {
    if (rows[y] > W * 0.3) {
      let y2 = y; while (y2 + 1 < H && rows[y2 + 1] > W * 0.3) y2++;
      // 붙어 있는 빔 등과 섞인 경우 가장 긴 행들만 오선으로
      let mx = 0; for (let k = y; k <= y2; k++) mx = Math.max(mx, rows[k]);
      for (let k = y; k <= y2; k++) {
        if (rows[k] < mx * 0.85) continue;
        let k2 = k; while (k2 + 1 <= y2 && rows[k2 + 1] >= mx * 0.85) k2++;
        if (k2 - k < 12) lines.push({ y: (k + k2) / 2, t: k2 - k + 1 });
        k = k2;
      }
      y = y2;
    }
  }
  // 2) 5줄 묶음 = 오선
  const staffs = [];
  for (let i = 0; i + 4 < lines.length;) {
    const ys = lines.slice(i, i + 5).map(l => l.y);
    const ds = [ys[1] - ys[0], ys[2] - ys[1], ys[3] - ys[2], ys[4] - ys[3]];
    const m = median(ds);
    if (m >= 4 && m <= H / 25 && ds.every(v => Math.abs(v - m) <= Math.max(2, m * 0.22))) {
      staffs.push({ top: ys[0], bottom: ys[4], sp: (ys[4] - ys[0]) / 4, ys }); i += 5;
    } else i++;
  }
  if (!staffs.length) return [];

  const D = (x, y) => (y < 0 || y >= H || x < 0 || x >= W) ? 0 : (bin[y * W + x] | (x > 0 ? bin[y * W + x - 1] : 0) | (x < W - 1 ? bin[y * W + x + 1] : 0));
  const colFrac = (x, ya, yb) => { ya = Math.max(0, Math.round(ya)); yb = Math.min(H - 1, Math.round(yb)); if (yb < ya) return 0; let c = 0; for (let y = ya; y <= yb; y++) c += D(x, y); return c / (yb - ya + 1); };

  // 3) 오선 가로 범위
  for (const s of staffs) {
    const L = [], R = [];
    for (const ly of s.ys) {
      const y = Math.round(ly); let best = [0, 0], st = -1, gap = 0;
      for (let x = 0; x < W; x++) {
        const dk = bin[y * W + x] | (y > 0 ? bin[(y - 1) * W + x] : 0) | (y < H - 1 ? bin[(y + 1) * W + x] : 0);
        if (dk) { if (st < 0) st = x; gap = 0; if (x - st > best[1] - best[0]) best = [st, x]; }
        else if (st >= 0 && ++gap > 3) { st = -1; gap = 0; }
      }
      L.push(best[0]); R.push(best[1]);
    }
    s.left = median(L); s.right = median(R);
  }

  // 4) 마디선 후보 : 오선 위~아래를 꽉 채우고, 바깥으로는 튀어나오지 않고, 옆에 음표 머리가 붙어 있지 않은 세로선
  for (let k = 0; k < staffs.length; k++) {
    const s = staffs[k], sp = s.sp, prev = staffs[k - 1], next = staffs[k + 1];
    s.cands = []; s.linkDown = 0;
    const x0 = Math.max(0, Math.round(s.left - 2)), x1 = Math.min(W - 1, Math.round(s.right + 2));
    // 오선 높이를 꽉 채우는 열(세로선) 표시
    const full = new Uint8Array(W);
    for (let x = x0; x <= x1; x++) full[x] = colFrac(x, s.top, s.bottom) >= 0.9 ? 1 : 0;
    // 옆 검사에 쓸 행(오선 줄 자체는 제외)
    const ya = Math.max(0, Math.round(s.top - 1.2 * sp)), yb = Math.min(H - 1, Math.round(s.bottom + 1.2 * sp));
    const sideRows = [];
    for (let y = ya; y <= yb; y++) if (!s.ys.some(ly => Math.abs(y - ly) <= 2)) sideRows.push(y);
    const reach = Math.max(3, Math.round(sp * 0.4));
    const side = (x, dir) => {
      let c = 0;
      for (const y of sideRows) {
        const o = y * W;
        for (let kk = 2; kk <= reach; kk++) { const xx = x + dir * kk; if (xx < 0 || xx >= W || full[xx]) continue; if (bin[o + xx]) { c++; break; } }
      }
      return sideRows.length ? c / sideRows.length : 0;
    };
    for (let x = x0; x <= x1; x++) {
      if (!full[x]) continue;
      if (side(x, -1) > 0.07 || side(x, 1) > 0.07) continue; // 음표 기둥(stem)

      let aboveOk = colFrac(x, s.top - 1.6 * sp, s.top - 0.45 * sp) <= 0.4;
      let belowOk = colFrac(x, s.bottom + 0.45 * sp, s.bottom + 1.6 * sp) <= 0.4;
      let linked = false;
      if (!belowOk && next && next.top - s.bottom < 14 * sp && colFrac(x, s.bottom, next.top) > 0.92) { belowOk = true; linked = true; }
      if (!aboveOk && prev && s.top - prev.bottom < 14 * sp && colFrac(x, prev.bottom, s.top) > 0.92) aboveOk = true;
      if (!aboveOk) { // 1·2번 괄호의 갈고리가 마디선 바로 위에 내려와 있는 경우: 위로 올라가다 가는 가로선을 만나면 마디선으로 인정
        let y = Math.round(s.top) - 1, lim = Math.max(0, Math.round(s.top - 6 * sp));
        while (y > lim && D(x, y)) y--;
        const yt = y + 1;
        for (const yy of [yt, yt + 1, yt + 2]) {
          let run = 0; for (let xx = x; xx < Math.min(W, x + 4 * sp); xx++) { if (bin[yy * W + xx] || bin[(yy + 1) * W + xx]) run++; else break; }
          let th = 0; const mx = Math.min(W - 1, x + Math.round(2 * sp)); for (let k = -3; k <= 6; k++) { const r = yy + k; if (r >= 0 && r < H && bin[r * W + mx]) th++; }
          if (run >= 2.5 * sp && th <= Math.max(3, sp * 0.3)) { aboveOk = true; break; }
        }
      }
      if (aboveOk && belowOk) { s.cands.push(x); if (linked) s.linkDown++; }
    }
  }
  // 5) 붙어 있는 열 → 하나의 마디선 {x, l, r}
  const groupX = (xs, sp) => {
    const out = []; let g = null;
    for (const x of xs) { if (g && x - g[1] <= Math.max(3, sp * 0.9)) g[1] = x; else { if (g) out.push(g); g = [x, x]; } }
    if (g) out.push(g);
    return out.map(g => ({ x: (g[0] + g[1]) / 2, l: g[0], r: g[1], repL: false, repR: false }));
  };
  // 도돌이표 점: 오선 2·3번째 칸 가운데에 작은 점(칸을 꽉 채우는 음표 머리와 구분), 1·4번째 칸은 비어 있음
  const darkAt = (x, y) => { const yy = Math.round(y); let c = 0; for (let d = -1; d <= 1; d++) { const r = yy + d; if (r >= 0 && r < H && bin[r * W + x]) c++; } return c >= 2; };
  const dotCol = (x, st) => {
    const sp = st.sp, t = st.top;
    for (const yc of [t + 1.5 * sp, t + 2.5 * sp]) {
      if (!darkAt(x, yc)) return false;
      if (darkAt(x, yc - 0.4 * sp) || darkAt(x, yc + 0.4 * sp)) return false;
    }
    return !darkAt(x, t + 0.5 * sp) && !darkAt(x, t + 3.5 * sp);
  };
  const hasDots = (a, b, st) => {
    let run = 0; a = Math.round(a); b = Math.round(b);
    for (let x = Math.max(0, a); x <= Math.min(W - 1, b); x++) { if (dotCol(x, st)) { if (++run >= 2) return true; } else run = 0; }
    return false;
  };
  // 1·2번 괄호: 오선 위 가는 가로선 + 왼쪽 끝이 아래로 꺾임 (빔은 두꺼워서 제외, 네모 박스는 아랫변이 있어 제외)

    const sp = st.sp, ya = Math.max(0, Math.round(Math.max(st.top - 5.5 * sp, yMin))), yb = Math.round(st.top - 0.9 * sp);
    const found = [];
    const thick = (x, y) => { let u = 0, d = 0; while (y - u - 1 >= 0 && bin[(y - u - 1) * W + x]) u++; while (y + d + 1 < H && bin[(y + d + 1) * W + x]) d++; return u + d + 1; };
    for (let y = ya; y <= yb; y++) {
      const o = y * W; let st0 = -1, gap = 0;
      for (let x = 0; x <= W; x++) {
        const dk = x < W && bin[o + x];
        if (dk) { if (st0 < 0) st0 = x; gap = 0; continue; }
        if (st0 >= 0 && ++gap <= 1 && x < W) continue;
        if (st0 >= 0) {
          const x0 = st0, x1 = x - gap; st0 = -1; gap = 0;
          if (x1 - x0 < 4 * sp) continue;
          const th = []; for (let k = 0; k < 9; k++) th.push(thick(Math.round(x0 + (x1 - x0) * (k + 0.5) / 9), y));
          if (median(th) > Math.max(3, sp * 0.28)) continue;           // 빔
          let hook = 0; for (let yy = y; yy <= y + Math.round(sp); yy++) if (yy < H && (bin[yy * W + x0] || bin[yy * W + x0 + 1] || (x0 > 0 && bin[yy * W + x0 - 1]))) hook++;

          let box = false;
          for (let yy = y + Math.round(sp * 0.6); yy <= Math.min(H - 1, y + Math.round(sp * 2.6), Math.round(st.top - sp * 0.35)) && !box; yy++) {
            let c = 0; for (let xx = x0 + 2; xx < x1 - 2; xx++) c += bin[yy * W + xx];
            if (c > (x1 - x0) * 0.8) box = true;
          }
          if (box) continue;                                              // 네모 박스(리허설 마크)
          if (!found.some(v => Math.abs(v.y - y) < sp * 0.6 && v.x0 < x1 && x0 < v.x1)) found.push({ x0, x1, y });
        }
      }
    }
    return found;
  };
  // 6) 마디선으로 연결된 오선은 한 줄(시스템)로 합치기
  const systems = [];
  let prevBottom = 0;
  for (let k = 0; k < staffs.length; k++) {
    const s = staffs[k]; const grp = [s];
    while (grp[grp.length - 1].cands.length && grp[grp.length - 1].linkDown >= Math.max(2, grp[grp.length - 1].cands.length * 0.5) && staffs[k + 1]) { k++; grp.push(staffs[k]); }
    const first = grp[0], last = grp[grp.length - 1], sp = first.sp;
    let bx = groupX(first.cands, sp).filter(b => b.x >= first.left - sp && b.x <= first.right + sp);
    for (const b of bx) { b.repL = hasDots(b.l - 1.8 * sp, b.l - 0.15 * sp, first); b.repR = hasDots(b.r + 0.15 * sp, b.r + 1.8 * sp, first); }
    const left = first.left, right = first.right;
    const mk = x => ({ x, l: x, r: x, repL: false, repR: false });
    if (!bx.length || bx[0].x - left > 1.5 * sp) bx.unshift(mk(left + 3 * sp)); // 시작 마디선이 없으면 음자리표 뒤에서 시작
    if (right - bx[bx.length - 1].x > 1.5 * sp) bx.push(mk(right));
    // 너무 좁은 구간 정리(도돌이표·겹세로줄 등) — 지운 마디선의 도돌이 정보는 옆 마디선으로 옮김
    for (let pass = 0; pass < 4 && bx.length > 2; pass++) {
      const segs = []; for (let i = 0; i < bx.length - 1; i++) segs.push(bx[i + 1].x - bx[i].x);
      const med = median(segs), minW = Math.max(3 * sp, med * 0.3);
      let changed = false;
      for (let i = 0; i < segs.length; i++) {
        if (segs[i] < minW && bx.length > 2) {
          let j, tgt;
          if (i === 0) j = 0; else if (i === segs.length - 1) j = bx.length - 1; else j = segs[i - 1] < segs[i + 1] ? i : i + 1;
          const rm = bx.splice(j, 1)[0];
          tgt = j === 0 ? bx[0] : (j >= bx.length ? bx[bx.length - 1] : bx[i]);
          tgt.repL = tgt.repL || rm.repL; tgt.repR = tgt.repR || rm.repR;
          changed = true; break;
        }
      }
      if (!changed) break;
    }
    if (bx.length < 2) continue;
    const voltas = findVoltas(first, prevBottom + sp);
    prevBottom = last.bottom;
    systems.push({ page, top: first.top, bottom: last.bottom, sp, bx, voltas });
  }
  // 띠 높이(위아래 여유) + 겹침 방지
  systems.forEach(s => { s.y0 = s.top - 2.4 * s.sp; s.y1 = s.bottom + 2.4 * s.sp; });
  for (let i = 0; i + 1 < systems.length; i++) {
    const a = systems[i], b = systems[i + 1];
    if (a.y1 > b.y0) { const mid = (a.bottom + b.top) / 2; a.y1 = Math.min(a.y1, mid); b.y0 = Math.max(b.y0, mid); }
  }
  return systems.map(s => {
    const out = {
      page, y0: clamp(s.y0 / H, 0, 1), y1: clamp(s.y1 / H, 0, 1), st: clamp(s.top / H, 0, 1),
      xs: s.bx.map(b => clamp(b.x / W, 0, 1))
    };
    // 자동 기호 인식용 임시 정보 (autoMarks에서 쓰고 지움)
    out._bars = s.bx.map(b => ({ l: b.repL, r: b.repR }));
    out._voltas = s.voltas.map(v => ({ x0: v.x0 / W, x1: v.x1 / W, y: v.y / H }));
    return out;
  });
}

/* ============================ 제목 · BPM 인식 ============================ */
function parseBpm(text) {
  if (!text) return null;
  const t = text.replace(/[Oo](?=\d)/g, '0').replace(/(?<=\d)[Oo]/g, '0');
  const pats = [
    /(?:bpm|tempo|템포)\s*[:=＝]?\s*(\d{2,3})/i,
    /(\d{2,3})\s*bpm/i,
    /[=＝]\s*(\d{2,3})(?!\d)/,
  ];
  for (const p of pats) { const m = t.match(p); if (m) { const n = +m[1]; if (n >= 30 && n <= 300) return n; } }
  return null;
}
function cleanTitle(s) {
  return (s || '').replace(/[^\p{L}\p{N}\s'’&\-()!?.,:#~]/gu, ' ').replace(/\s+/g, ' ').trim().replace(/^[-.,:~\s]+|[-.,:~\s]+$/g, '');
}
const hasWord = s => (s.match(/[\p{L}]/gu) || []).length >= 2;

function titleFromPdfItems(items, pageH) {
  const cands = items.filter(it => it.y < pageH * 0.35 && it.str.trim() && hasWord(it.str) && !/[=＝]\s*\d/.test(it.str) && !/bpm|tempo/i.test(it.str));
  if (!cands.length) return null;
  const maxSize = Math.max(...cands.map(c => c.size));
  const big = cands.filter(c => c.size >= maxSize * 0.9).sort((a, b) => a.y - b.y || a.x - b.x);
  const y0 = big[0].y;
  const line = big.filter(c => Math.abs(c.y - y0) < maxSize * 0.6).sort((a, b) => a.x - b.x);
  let out = '', lastEnd = null;
  for (const c of line) { if (lastEnd != null && c.x - lastEnd > c.size * 0.2 && !out.endsWith(' ')) out += ' '; out += c.str; lastEnd = c.x + c.w; }
  const t = cleanTitle(out);
  return t.length >= 1 ? t : null;
}

// --- OCR (이미지 악보, 글자 정보가 없는 PDF) ---
let tessWorkerP = null;
async function getTess() {
  if (!tessWorkerP) tessWorkerP = (async () => {
    await loadScript(TESS_URL);
    return await Tesseract.createWorker(['kor', 'eng'], 1, { logger: () => {} });
  })().catch(e => { tessWorkerP = null; throw e; });
  return tessWorkerP;
}
function ocrLines(data) {
  if (data.lines && data.lines.length) return data.lines;
  const out = []; (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => out.push(l))));
  return out;
}
async function ocrTitleBpm(canvas) {
  const worker = await withTimeout(getTess(), 90000);
  const { data } = await withTimeout(worker.recognize(canvas), 90000);
  const lines = ocrLines(data).map(l => ({ text: (l.text || '').trim(), conf: l.confidence, b: l.bbox }));
  const bpm = parseBpm(lines.map(l => l.text).join('\n'));
  const W = canvas.width;
  const junk = t => /[\u3131-\u318E]/.test(t) || (t.match(/[가-힣A-Za-z]/g) || []).length < Math.max(2, t.replace(/\s/g, '').length * 0.5);
  const cands = lines.filter(l => l.conf > 55 && hasWord(l.text) && !junk(l.text) && !/[=＝]\s*\d/.test(l.text) && !/bpm|tempo/i.test(l.text))
    .map(l => { const hgt = l.b.y1 - l.b.y0; const cx = (l.b.x0 + l.b.x1) / 2; const center = 1 - Math.min(1, Math.abs(cx - W / 2) / (W / 2)); return { ...l, score: hgt * (0.75 + 0.5 * center) * (0.6 + l.conf / 250) }; })
    .sort((a, b) => b.score - a.score);
  const title = cands.length ? cleanTitle(cands[0].text) : null;
  return { title: title && title.length >= 2 ? title : null, bpm };
}

/* ============================ 파일 → 페이지 이미지 ============================ */
async function getPdfjs() {
  if (!window.pdfjsLib) { await loadScript(PDFJS_URL); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; }
  return window.pdfjsLib;
}
function whiteCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d', { willReadFrequently: true }); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); return c; }

  catch (e) {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('이미지를 열 수 없어요')); im.src = URL.createObjectURL(blob); });

}
/** 사진 기울기 추정(라디안) — 오선이 수평이 되는 각도 찾기 */
function estimateSkew(canvas) {

  const c = whiteCanvas(sw, sh); c.getContext('2d').drawImage(canvas, 0, 0, sw, sh);
  const d = c.getContext('2d').getImageData(0, 0, sw, sh).data;
  const hist = new Uint32Array(256), g = new Uint8Array(sw * sh);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) { g[i] = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000 | 0; hist[g[i]]++; }

  const px = [], py = [];
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) if (g[y * sw + x] < thr) { px.push(x - sw / 2); py.push(y); }

  const step = Math.max(1, Math.floor(px.length / 80000));
  const bins = new Float64Array(sh + sw * 2);
  const score = a => {
    const t = Math.tan(a); bins.fill(0);
    for (let i = 0; i < px.length; i += step) { const k = Math.round(py[i] - px[i] * t + sw); if (k >= 0 && k < bins.length) bins[k]++; }

  for (let a = best - 0.25; a <= best + 0.25; a += 0.025) { const v = score(a * deg); if (v > bs) { bs = v; fine = a; } }

/** file → async iterator of {canvas, textItems?, pageH?} */
async function* filePages(file, onProg) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (!isPdf) { onProg && onProg(1, 1); yield { canvas: deskew(await blobToCanvas(file)) }; return; }
  const lib = await withTimeout(getPdfjs(), 30000);
  const pdf = await withTimeout(lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise, 60000)
    .catch(e => { throw new Error(e.message === 'timeout' ? 'PDF를 여는 데 너무 오래 걸려요' : 'PDF를 열 수 없어요'); });
  const n = Math.min(pdf.numPages, MAX_PDF_PAGES);
  for (let i = 1; i <= n; i++) {
    onProg && onProg(i, n);
    const page = await pdf.getPage(i);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: RENDER_W / vp1.width });
    const c = whiteCanvas(Math.round(vp.width), Math.round(vp.height));
    await withTimeout(page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise, 45000);
    let textItems = null;
    try {
      const tc = await page.getTextContent();
      textItems = tc.items.filter(it => it.str != null).map(it => ({ str: it.str, x: it.transform[4], y: vp1.height - it.transform[5], size: Math.hypot(it.transform[2], it.transform[3]) || it.height || 10, w: it.width || 0 }));
    } catch (e) {}
    yield { canvas: c, textItems, pageH: vp1.height, pageW: vp1.width };
    page.cleanup && page.cleanup();

}
function makeThumb(canvas) {

  const sh = Math.min(canvas.height, canvas.width * 0.75);
  t.getContext('2d').drawImage(canvas, 0, 0, canvas.width, sh, 0, 0, tw, tw * sh / canvas.width);

}

  c.getContext('2d').drawImage(canvas, 0, 0, canvas.width, h, 0, 0, canvas.width, h); return c;
}
function cleanFileName(n) { return n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim() || '제목 없음'; }

/* ============================ 가져오기 ============================ */
async function importFiles(files) {
  const list = [...files]; let ok = 0;
  for (let i = 0; i < list.length; i++) {
    const f = list[i];
    try { await importOne(f, (p, n) => busy(`${list.length > 1 ? `(${i + 1}/${list.length}) ` : ''}${f.name}\n악보 분석 중… ${n > 1 ? p + '/' + n + '페이지' : ''}`)); ok++; }
    catch (e) { console.error(e); toast(`${f.name}: 불러오지 못했어요 (${e.message || e})`, 3500); }
  }
  busy(null);
  await renderLibrary();
  if (ok) toast(ok > 1 ? `${ok}개 악보를 추가했어요` : '악보를 추가했어요');
}
async function importOne(file, onProg) {
  const sc = {
    id: uid(), title: cleanFileName(file.name), bpm: 100, beats: 4, countBeats: 4,
    titleAuto: false, bpmAuto: false, titleEdited: false, bpmEdited: false,
    pages: [], systems: [], marks: [], cues: [], thumb: '', status: 'ok',
    createdAt: Date.now(), updatedAt: Date.now(), lastPlayedAt: 0
  };
  let ocrCanvas = null, firstText = null, allText = '';
  let idx = 0;
  for await (const pg of filePages(file, onProg)) {
    const c = pg.canvas;
    if (pg.textItems) allText += pg.textItems.map(t => t.str).join(' ') + '\n';
    const systems = detectSystems(c, idx);
    if (idx === 0) {
      sc.thumb = makeThumb(c); firstText = pg.textItems ? { items: pg.textItems, h: pg.pageH } : null;
      // 제목·템포는 첫 오선 위쪽에만 있으니 그 부분만 OCR

      ocrCanvas = cropTop(c, clamp(firstY - 0.002, 0.06, 0.4));
    }
    sc.systems.push(...systems);
    sc.cues[idx] = pageCues(pg.textItems, pg.pageW, pg.pageH);
    const blob = await canvasToBlob(c);
    await DB.putPage(sc.id, idx, blob);
    sc.pages.push({ w: c.width, h: c.height });
    idx++;
  }

  // PDF 텍스트에서 제목/BPM

  if (hasText) {
    const t = titleFromPdfItems(firstText.items, firstText.h);

    const b = parseBpm(allText);

// OCR 은 뒤에서 하나씩 처리 (목록은 바로 사용 가능)
const ocrQueue = []; let ocrRunning = false;

async function runOcr() {
  if (ocrRunning) return; ocrRunning = true;
  while (ocrQueue.length) {
    const { id, canvas } = ocrQueue.shift();
    let res = null;
    try { res = await ocrTitleBpm(canvas); } catch (e) { console.warn('OCR 실패', e); }
    const sc = await DB.getScore(id); if (!sc) continue;
    const live = state.score && state.score.id === id ? state.score : sc;
    if (res) {
      if (res.title && !live.titleAuto && !live.titleEdited) { live.title = res.title; live.titleAuto = true; }
      if (res.bpm && !live.bpmAuto && !live.bpmEdited) { live.bpm = res.bpm; live.bpmAuto = true; if (live === state.score) { Engine.setBpm(live.bpm); } }
    }
    live.status = 'ok';
    await DB.putScore(live);
    if (live === state.score) updateHeader();
    if ($('#library').classList.contains('on')) renderLibrary();
  }

/* ============================ 목록 화면 ============================ */
const state = { scores: [], score: null, measures: [], mEls: [], startMeasure: 0, startPos: 0, curPos: -1, order: [], editSub: 'bars', curMeasure: -1, editMode: false, selSys: null, zoom: 1, pageEls: [], urls: [], suppressClick: 0 };

async function renderLibrary() {
  state.scores = (await DB.allScores()) || [];
  const q = $('#q').value.trim().toLowerCase();
  let list = state.scores.filter(s => !q || s.title.toLowerCase().includes(q));
  const sort = prefs.sort;
  if (sort === 'title') list.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
  else if (sort === 'added') list.sort((a, b) => b.createdAt - a.createdAt);
  else list.sort((a, b) => (b.lastPlayedAt || b.createdAt) - (a.lastPlayedAt || a.createdAt));

  btn.addEventListener('contextmenu', e => e.preventDefault());
}
holdRepeat($('#bpmDown'), () => setBpm(state.score.bpm - 1));
holdRepeat($('#bpmUp'), () => setBpm(state.score.bpm + 1));
$('#bpmVal').onclick = () => promptBpm(false);
$('#setBpmNow').onclick = () => promptBpm(false);
$('#fixTarget').onclick = () => { setEditMode(true, 'marks'); toast('그 기호가 있는 마디를 탭해서 표시해 주세요', 3000); };
$('#makeMeasures').onclick = () => { setEditMode(true); toast('악보의 각 줄(오선) 위를 탭해서 줄을 만들고, 줄 안을 탭해 마디선을 추가하세요', 5000); };
$('#editBtn').onclick = () => setEditMode(!state.editMode);
$('#infoTxt').style.cursor = 'pointer';
$('#infoTxt').onclick = () => {
  const sc = state.score; if (!sc) return;
  sc.countBeats = COUNT_OPTS[(COUNT_OPTS.indexOf(countOf(sc)) + 1) % COUNT_OPTS.length]; delete sc.countIn;
  saveScore(); updatePos(); toast(sc.countBeats ? `카운트인 ${sc.countBeats}박` : '카운트인 끔', 1200);
};
$('#editDone').onclick = () => setEditMode(false);
$('#redetectBtn').onclick = redetect;
$('#backBtn').onclick = () => {
  Engine.stop(true); setEditMode(false); saveScore();
  state.score = null; showView('library'); renderLibrary();
};
$('#ttlBtn').onclick = () => openSettings();
$('#setBtn').onclick = () => openSettings();
document.addEventListener('keydown', e => {
  if (!$('#player').classList.contains('on') || $('#modal').classList.contains('on')) return;
  if (e.code === 'Space') { e.preventDefault(); $('#playBtn').click(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setBpm(state.score.bpm + 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setBpm(state.score.bpm - 1); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && Engine.playing) Engine.stop(); });

/* ---------- 설정 시트 ---------- */
function openSettings() {
  const sc = state.score; if (!sc) return;
  if (Engine.playing) Engine.stop();
  openSheet(s => {
    s.innerHTML = `<h2>악보 설정</h2>
      <div class="field"><label>노래 제목 ${sc.titleAuto && !sc.titleEdited ? '<span style="color:var(--green)">· 자동 인식</span>' : ''}</label><input type="text" id="sTitle" value="${esc(sc.title)}"></div>
      <div class="row">
        <div class="field"><label>BPM ${sc.bpmAuto && !sc.bpmEdited ? '<span style="color:var(--green)">· 자동 인식</span>' : ''}</label><input type="number" inputmode="numeric" id="sBpm" min="30" max="300" value="${sc.bpm}"></div>
        <div class="field"><label>한 마디 박 수</label><input type="number" inputmode="numeric" id="sBeats" min="1" max="12" value="${sc.beats}"></div>
      </div>
      <div class="field" style="border-top:1px solid var(--line);padding-top:12px"><label>카운트인 (재생 전 세는 박 수)</label>
        <div class="seg" id="sCount">${COUNT_OPTS.map(v => `<button data-c="${v}" class="${countOf(sc) === v ? 'on' : ''}">${v ? v + '박' : '끔'}</button>`).join('')}</div>
        <div class="hint">4박 = 4·3·2·1 / 8박 = 8·7·…·1 로 화면에 숫자가 줄어들어요</div></div>
      <div class="toggle"><div><span>메트로놈 소리</span><small>꺼도 카운트인은 울려요</small></div><button class="sw ${prefs.metroOn ? 'on' : ''}" id="sMet"></button></div>
      <div class="field" style="border-top:1px solid var(--line);padding-top:12px"><label>메트로놈 볼륨</label><input type="range" id="sVol" min="0.05" max="1" step="0.05" value="${prefs.vol}"></div>
      <div class="btnlist">
        <button class="btn" id="sAddPage">➕ 페이지 추가 (다음 장 사진/PDF)</button>
        <button class="btn" id="sEdit">✏️ 마디 직접 편집</button>
        <button class="btn danger" id="sDel">🗑 이 악보 삭제</button>
      </div>
      <div class="btnrow"><button class="btn primary" id="sOk">저장</button></div>`;
    const sw = id => { const b = $(id, s); b.onclick = () => b.classList.toggle('on'); };
    sw('#sMet');
    s.querySelectorAll('#sCount button').forEach(b => b.onclick = () => { s.querySelectorAll('#sCount button').forEach(x => x.classList.toggle('on', x === b)); });
    $('#sVol', s).oninput = e => { prefs.vol = +e.target.value; };
    $('#sOk', s).onclick = () => {
      const t = $('#sTitle', s).value.trim(); if (t && t !== sc.title) { sc.title = t; sc.titleEdited = true; }
      const b = Math.round(+$('#sBpm', s).value); if (b >= 30 && b <= 300 && b !== sc.bpm) { sc.bpm = b; sc.bpmEdited = true; }
      const bt = Math.round(+$('#sBeats', s).value); if (bt >= 1 && bt <= 12) sc.beats = bt;
      const cb = $('#sCount button.on', s); if (cb) { sc.countBeats = +cb.dataset.c; delete sc.countIn; }
      prefs.metroOn = $('#sMet', s).classList.contains('on');
      saveScore(); updateHeader(); updatePos(); closeSheet(true);
    };
    $('#sAddPage', s).onclick = () => { closeSheet(null); $('#addPageIn').click(); };
    $('#sEdit', s).onclick = () => { closeSheet(null); setEditMode(true); };
    $('#sDel', s).onclick = async () => {
      closeSheet(null);
      if (await confirmBox('악보 삭제', `“${esc(sc.title)}” 악보를 이 기기에서 삭제할까요?`, '삭제', true)) {
        await DB.deleteScore(sc); state.score = null; showView('library'); renderLibrary(); toast('삭제했어요');
      }
    };
  });
}
$('#addPageIn').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = ''; const sc = state.score; if (!sc || !files.length) return;
  try {
    const firstNew = sc.pages.length;
    sc.cues = sc.cues || []; sc.marks = sc.marks || [];
    for (const f of files) {
      for await (const pg of filePages(f, (p, n) => busy(`페이지 추가 중… ${p}/${n}`))) {
        const idx = sc.pages.length;
        sc.systems.push(...detectSystems(pg.canvas, idx));
        sc.cues[idx] = pageCues(pg.textItems, pg.pageW, pg.pageH);
        await DB.putPage(sc.id, idx, await canvasToBlob(pg.canvas));
        sc.pages.push({ w: pg.canvas.width, h: pg.canvas.height });
      }
    }
    try { autoMarks(sc, firstNew); } catch (e) { for (const s of sc.systems) { delete s._bars; delete s._voltas; } }
    sc.updatedAt = Date.now(); await DB.putScore(sc); busy(null); await openScore(sc.id); toast('페이지를 추가했어요');
  } catch (err) { console.error(err); busy(null); toast('페이지를 추가하지 못했어요'); }
});

/* ============================ 시작 ============================ */
(async () => {
  await DB.open();
  await renderLibrary();
  window.__app = { state, Engine, detectSystems, deskew, DB, importFiles };
})();
</script>
</body>
</html>
